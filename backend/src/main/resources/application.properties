# Le nom de l'application
spring.application.name=backend

# ----- Connexion à MySQL (WAMP : utilisateur root, mot de passe vide) -----
spring.datasource.url=jdbc:mysql://localhost:3306/frigo_malin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ----- Hibernate : crée les tables tout seul -----
spring.jpa.hibernate.ddl-auto=update

# ----- GraphQL -----
spring.graphql.graphiql.enabled=true
spring.graphql.cors.allowed-origins=http://localhost:5173

spring.graphql.cors.allowed-headers=*